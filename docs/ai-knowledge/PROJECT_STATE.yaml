hypotheses:
  - id: "H1"
    text: "Adaptive PRV/pump control learned by PPO can lower leakage relative to fixed nominal settings under demand uncertainty."
    label: "HYPOTHESIS TO TEST"
  - id: "H2"
    text: "Lower leakage is NOT necessarily a better solution — leakage reduction can be confounded by demand starvation (DSR drop) and by PDA pressure feedback."
    label: "VALIDATED FACT (established in Phase 5 experiments)"

methodology:
  approach: "Model-based DRL (PPO) on a fixed benchmark network simulated with WNTR/EPANET; environment-first, training deferred."
  network_preserved: "126 junctions, 1 reservoir, 2 tanks, 168 pipes, 2 pumps, 8 PRVs"
  simulation: "96 h EPS; hydraulic timestep 30 min; native rule timestep 180 s; RL/reporting candidate control interval 1800 s"
  solver_config_non_negotiable:
    ACCURACY: 1.0e-5
    TRIALS: 2000
    RULE_TIMESTEP_s: 180
    CONTROL_REPORT_TIMESTEP_s: 1800
    note: "Must be asserted after every load; must NOT be left to WNTR defaults."
  demand_model_PDA:
    required_pressure_psi: 20
    minimum_pressure_psi: 0
    pressure_exponent: 0.5
    emitter_exponent: 0.5
  service_junctions: "121 service-bearing junctions; 5 connector nodes (JUNCTION-105,-106,-109,-110,-128) excluded from service statistics explicitly in code"
  actuators: "8 PRVs on dedicated valve links between paired artificial nodes; 2 pumps (PUMP-170, PUMP-172)"
  emitter_law: "signed: q = sign(p) * C * |p|^0.5"
  affinity_law: "h(q) = n^2*h0 - r*(q/n)^n_exp; max |residual| of any running operating point 8.62e-05 ft"
  train_eval_separation: "train/val/test/OOD scenario split with fixed seeds and scenario IDs (planned, not yet implemented)"

